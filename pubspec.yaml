name: voice_todo_app
description: "A Voice-Driven To-Do List App prototype"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.17.5
  google_fonts: ^6.1.0
  provider: ^6.1.4
  connectivity_plus: ^5.0.2
  speech_to_text: ^6.5.1
  flutter_tts: ^3.8.5
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/google_logo.svg
